{{ $src := .Get "imgSrc" }}
{{ $img := .Page.Resources.GetMatch $src }}
{{ $html := .Get "html" }}
{{ if $img }}
    <a
        class="artLink"
        href="{{ $src }}"
        data-pswp-width="{{ $img.Width }}"
        data-pswp-height="{{ $img.Height }}"
        target="_blank"
    >
        <div>
            {{ if $html }}
                {{ .Inner }}
            {{ else }}
                {{ .Inner | markdownify }}
            {{ end }}
        </div>
    </a>
{{ else }}
    <p>image not found: {{ $src }}</p>
{{ end }}
